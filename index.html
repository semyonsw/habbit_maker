<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Habit Maker is a local-first tracker for daily routines."
    />
    <meta
      name="keywords"
      content="habit tracker, productivity, routine, goals, local-first, javascript"
    />
    <meta name="author" content="Semyon" />
    <meta name="theme-color" content="#0d0f14" />
    <!-- Installed-app behaviour. "black-translucent" is load-bearing: together with
         viewport-fit=cover it is what makes env(safe-area-inset-top) report a real
         value in iOS standalone. Without it every calc(... + var(--safe-*)) in
         styles.css silently collapses to its base value. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Habits" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:title" content="Habit Maker" />
    <meta
      property="og:description"
      content="Track daily habits in a clean, local-first web app."
    />
    <meta property="og:type" content="website" />
    <title>Habit Maker | Local-First Habit Tracker</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>"
    />
    <!-- PWA: installable app shell. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192.png" />
    <script>
      // Paint the stored theme before first paint so a Light-theme user never
      // sees a dark flash. Mirrors resolveTheme() in src/ui-prefs.js; the real
      // preference is read back out of IndexedDB once the app boots.
      (function () {
        try {
          var t = localStorage.getItem("hm.theme") || "dark";
          var dark =
            t === "dark" ||
            (t === "auto" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light",
          );
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div
      id="globalLoadingOverlay"
      class="global-loading-overlay open"
      aria-hidden="false"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    >
      <div class="global-loading-card">
        <span class="global-loading-spinner" aria-hidden="true"></span>
        <p class="global-loading-title">Please wait</p>
        <p id="globalLoadingMessage" class="global-loading-message">
          Loading...
        </p>
      </div>
    </div>

    <div id="app" style="display: none">
      <main class="app-main">
        <!-- 1. Today ------------------------------------------------------ -->
        <section class="view active" id="view-today" aria-label="Today">
          <div class="today-head">
            <div>
              <div class="eyebrow" id="todayWeekday"></div>
              <div class="today-date" id="todayDate"></div>
            </div>
            <div class="today-figure">
              <div class="today-pct" id="todayPct">0%</div>
              <div class="today-count" id="todayCount">0 of 0 done</div>
            </div>
          </div>
          <div
            class="today-progress"
            id="todayProgress"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            aria-label="Habits completed"
          >
            <span style="width: 0%"></span>
          </div>

          <div class="today-listhead">
            <div class="eyebrow" id="todayListLabel">Today</div>
            <div class="today-scheduled" id="todayScheduled"></div>
          </div>

          <div id="todayMonthNav"></div>
          <div class="day-strip" id="dayStrip" role="group" aria-label="Pick a day"></div>
          <div class="habit-list" id="todayList"></div>
          <div class="list-hint" id="todayListHint"></div>

          <!-- One-off tasks for the selected day. Its own section, and its own
               count: a task is deliberately absent from the completion figure
               and the strength maths above it. See src/task-core.js. Rendered
               as one block so that "no tasks" is simply an empty container,
               and .task-row can never be picked up by the habit drag in
               src/reorder.js, which walks .habit-row inside its own list. -->
          <div id="todayTasks"></div>

          <div class="add-row">
            <button type="button" class="add-habit-btn" id="btnAddHabit">
              Add habit
            </button>
            <button type="button" class="add-habit-btn" id="btnAddTask">
              Add task
            </button>
          </div>
        </section>

        <!-- 2. Habit detail ------------------------------------------------ -->
        <section class="view" id="view-detail" aria-label="Habit detail">
          <div id="detailBody"></div>
        </section>

        <!-- 3. Analytics --------------------------------------------------- -->
        <section class="view" id="view-analytics" aria-label="Analytics">
          <div class="screen-title">Analytics</div>
          <div class="analytics-sub" id="analyticsSub"></div>
          <div id="analyticsMonthNav"></div>
          <div id="analyticsBody"></div>
        </section>

        <!-- 4. Settings ---------------------------------------------------- -->
        <section class="view" id="view-settings" aria-label="Settings">
          <div class="screen-title">Settings</div>
          <div id="settingsBody"></div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Primary">
        <button type="button" class="nav-btn is-active" data-view="today">
          <svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3.5" y="4.5" width="17" height="16" rx="3.5" />
            <path d="M8 9.5l2.6 2.6L16 6.8" />
          </svg>
          <span>Today</span>
        </button>
        <button type="button" class="nav-btn" data-view="analytics">
          <svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M5 20V12" />
            <path d="M12 20V5" />
            <path d="M19 20v-6" />
          </svg>
          <span>Analytics</span>
        </button>
        <button type="button" class="nav-btn" data-view="settings">
          <svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4 8h10" />
            <path d="M18 8h2" />
            <path d="M4 16h4" />
            <path d="M12 16h8" />
            <circle cx="16" cy="8" r="2.2" />
            <circle cx="10" cy="16" r="2.2" />
          </svg>
          <span>Settings</span>
        </button>
      </nav>

      <!-- Add / edit habit sheet ------------------------------------------ -->
      <div
        class="sheet-overlay"
        id="habitSheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="habitSheetTitle"
      >
        <button
          type="button"
          class="sheet-scrim"
          id="habitSheetScrim"
          aria-label="Close"
        ></button>
        <div class="sheet" id="habitSheetPanel">
          <div class="sheet-handle" aria-hidden="true"></div>
          <div class="sheet-title" id="habitSheetTitle">New habit</div>
          <div id="habitSheetBody"></div>
        </div>
      </div>

      <!-- Add / edit one-off task sheet ----------------------------------- -->
      <div
        class="sheet-overlay"
        id="taskSheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="taskSheetTitle"
      >
        <button
          type="button"
          class="sheet-scrim"
          id="taskSheetScrim"
          aria-label="Close"
        ></button>
        <div class="sheet" id="taskSheetPanel">
          <div class="sheet-handle" aria-hidden="true"></div>
          <div class="sheet-title" id="taskSheetTitle">New task</div>
          <div id="taskSheetBody"></div>
        </div>
      </div>

      <!-- Confirm dialog --------------------------------------------------- -->
      <div
        class="dialog-overlay"
        id="confirmDialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="confirmTitle"
      >
        <div class="dialog">
          <div class="dialog-title" id="confirmTitle">Are you sure?</div>
          <p class="dialog-body" id="confirmMessage"></p>
          <div class="dialog-actions">
            <button type="button" class="btn btn-ghost" id="confirmCancel">
              Cancel
            </button>
            <button type="button" class="btn btn-primary" id="confirmOk">
              Confirm
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Boot-time error surface. These handlers must stay: the in-app logging
      // handlers only start after bindEvents(), so anything that fails during
      // boot would otherwise be invisible.
      //
      // The full red banner is developer UI though -- it covers up to half a
      // phone screen, has no dismiss, and stacked a fresh copy per error. So:
      // full banner only with ?debug=1 (or a sticky localStorage flag),
      // otherwise a compact dismissible toast. Always console.error.
      (function () {
        var DEBUG =
          location.search.indexOf("debug=1") !== -1 ||
          (function () {
            try {
              return localStorage.getItem("hm.debugBanner") === "1";
            } catch (_) {
              return false;
            }
          })();

        var node = null;
        var lastText = "";
        var lastAt = 0;
        var hideTimer = 0;

        function show(text) {
          if (window.console && console.error) console.error(text);

          // Dedupe: one failing render can fire many identical errors.
          var now = Date.now();
          if (text === lastText && now - lastAt < 5000) return;
          lastText = text;
          lastAt = now;

          if (!node) {
            node = document.createElement("div");
            node.className = DEBUG ? "boot-error-banner" : "boot-error-toast";
            var msg = document.createElement("span");
            msg.className = "boot-error-text";
            node.appendChild(msg);
            var close = document.createElement("button");
            close.type = "button";
            close.className = "boot-error-close";
            close.setAttribute("aria-label", "Dismiss");
            close.textContent = "×";
            close.onclick = function () {
              node.remove();
              node = null;
            };
            node.appendChild(close);
          }
          node.querySelector(".boot-error-text").textContent = DEBUG
            ? text
            : "Something went wrong. Please try again.";
          // append, not prepend: prepending displaces #globalLoadingOverlay.
          if (!node.isConnected) document.body.appendChild(node);

          if (!DEBUG) {
            clearTimeout(hideTimer);
            hideTimer = setTimeout(function () {
              if (node) {
                node.remove();
                node = null;
              }
            }, 8000);
          }
        }

        window.onerror = function (msg, src, line, col, err) {
          show(
            "JS ERROR: " +
              msg +
              "\nFile: " +
              src +
              ":" +
              line +
              ":" +
              col +
              "\n" +
              (err && err.stack ? err.stack : ""),
          );
        };
        window.addEventListener("unhandledrejection", function (e) {
          show(
            "UNHANDLED PROMISE: " +
              (e.reason && e.reason.stack ? e.reason.stack : e.reason),
          );
        });
      })();
    </script>
    <script>
      // Register the service worker for offline use + installability, but ONLY
      // off-localhost. The PC build is served by the Python server on localhost
      // and must stay cache-free so it behaves exactly as before (and so the
      // service worker never sits in front of the /api SQLite backend).
      (function () {
        var h = location.hostname;
        var isLocal =
          h === "localhost" || h === "127.0.0.1" || h === "[::1]" || h === "::1";
        // Inside the Android APK every asset is already on-device, so a service
        // worker would only add a second, stale cache layer in front of them.
        // sw.js is not even shipped into www/ -- see scripts/build-www.mjs.
        var isNative = !!window.Capacitor;
        if ("serviceWorker" in navigator && !isLocal && !isNative) {
          // Captured BEFORE register(): on a first-ever install there is no
          // controller, and controllerchange fires immediately. Without this
          // guard every new visitor would reload themselves once.
          var hadController = !!navigator.serviceWorker.controller;
          var refreshing = false;

          navigator.serviceWorker.addEventListener(
            "controllerchange",
            function () {
              if (!hadController || refreshing) return;
              refreshing = true;
              // sw.js calls skipWaiting(), so a new worker takes over while the
              // page is still running the previously cached JS. Reload to get a
              // matched set -- but not while the user is mid-task.
              var busy = document.querySelector(
                ".sheet-overlay.open, .dialog-overlay.open",
              );
              if (busy) {
                document.addEventListener("visibilitychange", function once() {
                  if (document.visibilityState === "hidden") {
                    document.removeEventListener("visibilitychange", once);
                    location.reload();
                  }
                });
                return;
              }
              location.reload();
            },
          );

          window.addEventListener("load", function () {
            navigator.serviceWorker.register("sw.js").catch(function () {});
          });
        }
      })();
    </script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
