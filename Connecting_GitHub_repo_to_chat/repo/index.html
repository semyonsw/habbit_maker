<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Habit Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" hidden>
  <main id="view" class="view"></main>
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-act="nav" data-view="today" aria-label="Today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3.5"></rect><path d="M8 9.5l2.6 2.6L16 6.8"></path></svg>
      <span>Today</span>
    </button>
    <button class="tab" data-act="nav" data-view="analytics" aria-label="Analytics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V12"></path><path d="M12 20V5"></path><path d="M19 20v-6"></path></svg>
      <span>Analytics</span>
    </button>
    <button class="tab" data-act="nav" data-view="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h10"></path><path d="M18 8h2"></path><path d="M4 16h4"></path><path d="M12 16h8"></path><circle cx="16" cy="8" r="2.2"></circle><circle cx="10" cy="16" r="2.2"></circle></svg>
      <span>Settings</span>
    </button>
  </nav>
</div>

<div id="sheetRoot" class="sheet-root" hidden>
  <div class="sheet-scrim" data-act="sheet-close"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div id="boot" class="boot"><div class="boot-dot"></div></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script type="module" src="src/app.js"></script>
</body>
</html>
