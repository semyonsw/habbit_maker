# Lint and unit tests on every push and pull request.
#
# The app has no build step, so there is nothing to compile here -- this exists
# because the maths in src/scoring.js (streaks, habit strength, the schedule
# predicates) is the part that fails quietly and wrongly rather than loudly, and
# it now has tests that would have caught the month-gap streak bug.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm ci` needs the lockfile to match package.json exactly; this repo has
      # one, so it is the right call and keeps CI honest about dependencies.
      - run: npm ci

      - run: npm run lint

      - run: npm test
